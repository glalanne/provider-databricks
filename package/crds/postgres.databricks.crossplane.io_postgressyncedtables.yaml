                    type: object
                  status:
                    description: Synced Table data synchronization status
                    properties:
                      detailedState:
                        description: 'The state of the synced table. Possible values
                          are: SYNCED_TABLE_OFFLINE, SYNCED_TABLE_OFFLINE_FAILED,
                          SYNCED_TABLE_ONLINE, SYNCED_TABLE_ONLINE_CONTINUOUS_UPDATE,
                          SYNCED_TABLE_ONLINE_NO_PENDING_UPDATE, SYNCED_TABLE_ONLINE_PIPELINE_FAILED,
                          SYNCED_TABLE_ONLINE_TRIGGERED_UPDATE, SYNCED_TABLE_ONLINE_UPDATING_PIPELINE_RESOURCES,
                          SYNCED_TABLE_PROVISIONING, SYNCED_TABLE_PROVISIONING_INITIAL_SNAPSHOT,
                          SYNCED_TABLE_PROVISIONING_PIPELINE_RESOURCES'
                        type: string
