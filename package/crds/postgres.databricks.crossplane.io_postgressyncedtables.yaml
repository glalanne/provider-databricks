                        description: The last source table Delta version that was
                          successfully synced to the synced table
                        type: number
                      lastSync:
                        description: Summary of the last successful synchronization
                          from source to destination
                        properties:
                          deltaTableSyncInfo:
                            description: (DeltaTableSyncInfo)
                            properties:
                              deltaCommitTime:
                                description: |-
                                  The timestamp when the above Delta version was committed in the source Delta table.
                                  Note: This is the Delta commit time, not the time the data was written to the synced table
                                type: string
                              deltaCommitVersion:
