# Passwordless authentication for the legacy cluster-scoped API. The service account's namespace needs the
# ServiceAccount, Role and RoleBinding in ../namespaced/providerconfig-oidctokenrequest.yaml; for account-level
# operations, see ../namespaced/clusterproviderconfig-oidctokenrequest.yaml.

apiVersion: databricks.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: oidctokenrequest
spec:
  credentials:
    source: OIDCTokenRequest
    serviceAccountRef:
      name: databricks
      namespace: platform # required on a cluster-scoped config
  host: https://adb-1234567890123456.7.azuredatabricks.net
