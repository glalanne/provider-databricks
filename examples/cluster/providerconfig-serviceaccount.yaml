# Passwordless authentication for the legacy cluster-scoped API. See
# ../namespaced/providerconfig-serviceaccount.yaml for the ServiceAccount, Role and RoleBinding the service
# account's namespace needs, and ../namespaced/clusterproviderconfig-serviceaccount.yaml for an account-level
# example.

apiVersion: databricks.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: serviceaccount
spec:
  credentials:
    source: ServiceAccount
    serviceAccountRef:
      name: databricks
      namespace: platform # required: this ProviderConfig is cluster-scoped
  host: https://adb-1234567890123456.7.azuredatabricks.net
