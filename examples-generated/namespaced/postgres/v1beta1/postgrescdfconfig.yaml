apiVersion: postgres.databricks.m.crossplane.io/v1beta1
kind: PostgresCdfConfig
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgrescdfconfig
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: upbound-system
spec:
  forProvider:
    catalog: main
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: app
    postgresSchema: public
    schema: app_replicated

---

apiVersion: postgres.databricks.m.crossplane.io/v1beta1
kind: PostgresBranch
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgrescdfconfig
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    branchId: main
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    spec:
      noExpiry: true

---

apiVersion: postgres.databricks.m.crossplane.io/v1beta1
kind: PostgresDatabase
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgrescdfconfig
  labels:
    testing.upbound.io/example-name: app
  name: app
  namespace: upbound-system
spec:
  forProvider:
    databaseId: app_db
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: main
    spec:
      postgresDatabase: app_db

---

apiVersion: postgres.databricks.m.crossplane.io/v1beta1
kind: PostgresProject
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgrescdfconfig
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: upbound-system
spec:
  forProvider:
    projectId: my-project
    spec:
      displayName: My Project
      pgVersion: 17
