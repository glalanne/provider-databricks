apiVersion: settings.databricks.crossplane.io/v1beta1
kind: DisableLegacyFeaturesSetting
metadata:
  annotations:
    meta.upbound.io/example-id: settings/v1beta1/disablelegacyfeaturessetting
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    disableLegacyFeatures:
      value: true

---

apiVersion: settings.databricks.crossplane.io/v1beta1
kind: DefaultNamespaceSetting
metadata:
  annotations:
    meta.upbound.io/example-id: settings/v1beta1/disablelegacyfeaturessetting
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    namespace:
      value: default_catalog
