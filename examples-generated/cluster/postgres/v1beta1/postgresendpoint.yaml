apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresEndpoint
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresendpoint
  labels:
    testing.upbound.io/example-name: primary
  name: primary
spec:
  forProvider:
    endpointId: primary
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: dev
    replaceExisting: true
    spec:
      autoscalingLimitMaxCu: 4
      autoscalingLimitMinCu: 0.5
      endpointType: ENDPOINT_TYPE_READ_WRITE
      suspendTimeoutDuration: 600s

---

apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresBranch
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresendpoint
  labels:
    testing.upbound.io/example-name: dev
  name: dev
spec:
  forProvider:
    branchId: dev-branch
    parentSelector:
      matchLabels:
        testing.upbound.io/example-name: this
    spec:
      noExpiry: true

---

apiVersion: postgres.databricks.crossplane.io/v1beta1
kind: PostgresProject
metadata:
  annotations:
    meta.upbound.io/example-id: postgres/v1beta1/postgresendpoint
  labels:
    testing.upbound.io/example-name: this
  name: this
spec:
  forProvider:
    projectId: my-project
    spec:
      displayName: My Project
      pgVersion: 17
